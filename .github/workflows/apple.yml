name: Apple clients

on:
  workflow_dispatch:
  push:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"
  pull_request:
    paths:
      - "apple/**"
      - ".github/workflows/apple.yml"

jobs:
  swift:
    runs-on: macos-14
    defaults:
      run:
        working-directory: apple
    steps:
      - uses: actions/checkout@v4
      - name: Show Apple toolchain
        run: xcodebuild -version && swift --version
      - name: Audit public Apple source boundary
        run: |
          if rg -n -i 'password|browser[- ]?cookie|import[- ]?cookie|cookie[- ]?jar|webview|react native|flutter|T[O]DO|FIXME|fatalError\(|api key|token' Sources Tests Apps; then
            echo 'Forbidden Apple source boundary text found.'
            exit 1
          fi
          if rg -n '[ \t]+$' Sources Tests Apps; then
            echo 'Trailing whitespace found in Apple sources.'
            exit 1
          fi
      - name: Run Core tests
        run: swift test
      - name: Build macOS product
        run: swift build --product OJNexusMacOS
      - name: Build iOS Simulator product
        run: xcodebuild -scheme OJNexusIOS -destination 'generic/platform=iOS Simulator' build CODE_SIGNING_ALLOWED=NO
      - name: Run recovery tests on an installed iOS Simulator
        timeout-minutes: 25
        run: bash scripts/test-ios-recovery.sh "$RUNNER_TEMP/ios-recovery-evidence"
      - name: Upload iOS recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-recovery-evidence
          path: ${{ runner.temp }}/ios-recovery-evidence/
          retention-days: 7
          if-no-files-found: warn
